name: Qualité (lint + tests e2e)

# Contrôle qualité indépendant du déploiement Pages : vérifie le code à chaque
# push et pull request. Tout est bloquant : lint, tests unitaires, garde-fou des
# assets minifiés et tests e2e (Playwright). Les e2e, éprouvés en CI, ne sont
# plus en mode informatif ; une régression d'interface casse désormais le
# workflow. Le déploiement Pages reste indépendant (jamais bloqué par ce job).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Tests unitaires (Node natif, sans navigateur)
        run: npm run test:unit

  # Garde-fou anti-dérive des assets minifiés : les `*.min.*` servis par le site
  # sont committés et régénérés à la main. On les régénère ici et on échoue si le
  # résultat diffère du dépôt (source modifiée sans régénérer le `.min`).
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Régénérer les assets minifiés
        run: npm run build:min
      - name: Vérifier l'absence de dérive
        run: |
          if ! git diff --exit-code -- 'css/*.min.css' 'js/*.min.js'; then
            echo "::error::Un asset minifié est obsolète. Lancez « npm run build:min » puis committez les fichiers *.min.*."
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer le navigateur Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: npm test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
