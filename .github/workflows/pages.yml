name: Déploiement GitHub Pages

# Publie le site sur GitHub Pages en EXCLUANT les fichiers-source du COR
# (data/Données du COR/) : ces 225 Mo restent dans le dépôt comme preuve, mais
# n'alourdissent pas le site déployé. La suppression n'a lieu que dans le
# checkout éphémère du job — la branche main n'est jamais modifiée.
#
# ⚠️ Prérequis (une fois) : Settings › Pages › Build and deployment › Source
#    doit être réglé sur « GitHub Actions ».

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions minimales nécessaires au déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement Pages à la fois ; on laisse finir celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Préparer le site (exclure les fichiers-preuve lourds du COR)
        run: rm -rf "data/Données du COR"

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Téléverser l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Audit qualité du site RÉELLEMENT déployé (vrai chemin /Le-COR/, CSP, URLs
  # absolues du JSON-LD/sitemap). S'exécute après « deploy » ; informatif au
  # début (continue-on-error) — il ne bloque jamais la mise en ligne.
  audit:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    env:
      SITE_URL: https://wald52.github.io/Le-COR/
    steps:
      - name: Récupérer le dépôt (config Lighthouse + lychee)
        uses: actions/checkout@v5

      - name: Attendre la propagation du déploiement
        run: |
          echo "Attente d'un HTTP 200 sur $SITE_URL …"
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL" || echo 000)
            echo "Tentative $i : HTTP $code"
            if [ "$code" = "200" ]; then echo "Site en ligne."; exit 0; fi
            sleep 10
          done
          echo "::warning::Le site n'a pas répondu 200 après ~3 min ; audit lancé quand même."

      - name: Lighthouse CI (perf, a11y, best-practices, SEO)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-rapport

      - name: Contrôle des liens cassés (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # On crawle la page d'accueil et la page légale déployées. Le préfixe
          # « Données du COR » est exclu : ces fichiers-preuve ne sont
          # volontairement pas servis (404 attendu), seuls de VRAIS liens morts
          # doivent faire échouer l'étape.
          args: >-
            --no-progress
            --exclude 'Donn%C3%A9es%20du%20COR'
            --exclude 'Données du COR'
            https://wald52.github.io/Le-COR/
            https://wald52.github.io/Le-COR/legal.html
          fail: true
