name: Déploiement GitHub Pages

# Publie le site sur GitHub Pages en EXCLUANT ce qui n'a pas à être servi : les
# fichiers-source du COR (data/Données du COR/, 225 Mo), l'outillage de
# développement et les images non référencées. Tout cela reste dans le dépôt ;
# la suppression n'a lieu que dans le checkout éphémère du job — la branche main
# n'est jamais modifiée. Voir l'étape « Préparer le site » pour le détail.
#
# ⚠️ Prérequis (une fois) : Settings › Pages › Build and deployment › Source
#    doit être réglé sur « GitHub Actions ».

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions minimales nécessaires au déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement Pages à la fois ; on laisse finir celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      # Le téléversement prend « path: . » : sans ce ménage, TOUT le dépôt part
      # sur Pages. Suppressions limitées au checkout éphémère du job — la branche
      # main n'est jamais modifiée, tous ces fichiers restent versionnés.
      #
      # On GARDE volontairement : les css/*.css et js/*.js non minifiés (lire la
      # source en regard du .min fait partie de la transparence du projet),
      # notes/, et README/CHANGELOG/CONTRIBUTING/LICENSE.
      - name: Préparer le site (exclure ce qui n'a pas à être publié)
        run: |
          # Fichiers-preuve du COR : 225 Mo qui restent dans le dépôt comme
          # preuve, mais n'ont pas à alourdir le site déployé.
          rm -rf "data/Données du COR"
          # Outillage de développement : jamais chargé par une page.
          rm -rf tests tools
          # Relais de signalement : code déployé chez Cloudflare (wrangler), pas
          # sur Pages. Sa configuration n'a rien à faire sur le site.
          rm -rf worker
          rm -f package.json package-lock.json eslint.config.mjs \
                playwright.config.js .prettierrc.json .prettierignore CLAUDE.md
          # Originaux d'avant la conversion WebP (~1,3 Mo) : aucun HTML, CSS, JS,
          # manifeste ni service worker ne les référence — seuls les .webp le sont.
          # Ils restent versionnés, tools/optimize-images.py s'en sert.
          rm -f images/*.jpg
          # Autres fichiers non référencés (vérifiés un à un).
          rm -f images/intro-cor.webp icons/le-modele-social-francais.png \
                icons/icon-no-bg.svg icons/make_icons.py
          echo "Poids du site déployé : $(du -sh --exclude=.git . | cut -f1)"

      - name: Configurer Pages
        uses: actions/configure-pages@v6

      - name: Téléverser l'artefact du site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Audit qualité du site RÉELLEMENT déployé (vrai chemin /Le-COR/, CSP, URLs
  # absolues du JSON-LD/sitemap). S'exécute après « deploy ».
  #
  # Les seuils Lighthouse assertent en `error` depuis que les quatre catégories
  # tiennent 100 % : une régression doit être VISIBLE (job rouge), pas noyée
  # dans un avertissement. Le `continue-on-error` reste, lui, volontaire : il
  # porte sur le job, pas sur les seuils — l'audit tourne APRÈS le déploiement,
  # le rendre bloquant n'annulerait pas une mise en ligne déjà faite et
  # masquerait le reste du rapport. Il alerte, il ne barre pas la route.
  audit:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    env:
      SITE_URL: https://wald52.github.io/Le-COR/
    steps:
      - name: Récupérer le dépôt (config Lighthouse + lychee)
        uses: actions/checkout@v7

      - name: Attendre la propagation du déploiement
        run: |
          echo "Attente d'un HTTP 200 sur $SITE_URL …"
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL" || echo 000)
            echo "Tentative $i : HTTP $code"
            if [ "$code" = "200" ]; then echo "Site en ligne."; exit 0; fi
            sleep 10
          done
          echo "::warning::Le site n'a pas répondu 200 après ~3 min ; audit lancé quand même."

      - name: Lighthouse CI (perf, a11y, best-practices, SEO)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-rapport

      # Scores chiffrés directement lisibles dans l'onglet « Summary » du job,
      # sans avoir à télécharger l'artefact. lhci écrit un manifest.json dans
      # .lighthouseci/ : on en extrait le run représentatif de chaque URL et on
      # affiche un tableau (catégories en %). Permet de suivre la tendance d'un
      # commit à l'autre. `if: always()` : on veut le tableau même si une
      # assertion a échoué à l'étape précédente.
      - name: Résumé des scores Lighthouse
        if: always()
        run: |
          node <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const path = '.lighthouseci/manifest.json';
          if (!fs.existsSync(path)) {
            console.log('## Scores Lighthouse\n\n_Aucun rapport `.lighthouseci/manifest.json` trouvé._');
            process.exit(0);
          }
          const runs = JSON.parse(fs.readFileSync(path, 'utf8'))
            .filter(r => r.isRepresentativeRun);
          const cats = [
            ['performance', 'Performance'],
            ['accessibility', 'Accessibilité'],
            ['best-practices', 'Bonnes pratiques'],
            ['seo', 'SEO'],
          ];
          const pct = v => (v == null ? '—' : Math.round(v * 100) + ' %');
          let out = '## Scores Lighthouse\n\n';
          out += '| Page | ' + cats.map(c => c[1]).join(' | ') + ' |\n';
          out += '|------|' + cats.map(() => '------').join('|') + '|\n';
          for (const r of runs) {
            const u = r.url.replace('https://wald52.github.io', '');
            out += '| `' + u + '` | '
              + cats.map(c => pct(r.summary[c[0]])).join(' | ') + ' |\n';
          }
          out += '\nSeuil : 95 % dans chaque catégorie (les quatre sont à 100 % au 27/07/2026). '
            + 'Exception : le SEO de `legal.html`, volontairement en `noindex`.';

          // Détail : audits d'accessibilité non parfaits (score < 1), page par
          // page, pour cibler les corrections sans deviner. On lit le rapport
          // complet (lhr) du run représentatif via son jsonPath du manifest.
          const basename = p => (p || '').split('/').pop();
          out += '\n\n## Accessibilité — audits à corriger\n';
          for (const r of runs) {
            const u = r.url.replace('https://wald52.github.io', '');
            let lhr = null;
            for (const p of [r.jsonPath, '.lighthouseci/' + basename(r.jsonPath)]) {
              try { lhr = JSON.parse(fs.readFileSync(p, 'utf8')); break; } catch (e) {}
            }
            if (!lhr) { out += '\n### `' + u + '`\n_Rapport détaillé introuvable._\n'; continue; }
            const cat = lhr.categories && lhr.categories.accessibility;
            const audits = lhr.audits || {};
            const refs = (cat && cat.auditRefs) || [];
            const failed = refs.map(ref => audits[ref.id])
              .filter(a => a && a.score !== null && a.score < 1);
            out += '\n### `' + u + '` — ' + pct(cat && cat.score) + '\n';
            if (!failed.length) { out += '_Aucun audit en échec._\n'; continue; }
            for (const a of failed) out += '- **' + a.id + '** — ' + a.title + '\n';
          }
          // Détail : performance — métriques clés + audits d'opportunité non
          // parfaits, page par page, pour cibler la cause racine (LCP/TBT/CLS…)
          // sans deviner. Même lecture manifest→lhr que pour l'accessibilité.
          const metricIds = [
            ['largest-contentful-paint', 'LCP'],
            ['total-blocking-time', 'TBT'],
            ['cumulative-layout-shift', 'CLS'],
            ['first-contentful-paint', 'FCP'],
            ['speed-index', 'Speed Index'],
          ];
          const savings = a => (a && a.details && a.details.overallSavingsMs) || 0;
          out += '\n\n## Performance — métriques & audits à corriger\n';
          for (const r of runs) {
            const u = r.url.replace('https://wald52.github.io', '');
            let lhr = null;
            for (const p of [r.jsonPath, '.lighthouseci/' + basename(r.jsonPath)]) {
              try { lhr = JSON.parse(fs.readFileSync(p, 'utf8')); break; } catch (e) {}
            }
            if (!lhr) { out += '\n### `' + u + '`\n_Rapport détaillé introuvable._\n'; continue; }
            const cat = lhr.categories && lhr.categories.performance;
            const audits = lhr.audits || {};
            out += '\n### `' + u + '` — ' + pct(cat && cat.score) + '\n';
            out += metricIds.filter(m => audits[m[0]])
              .map(m => m[1] + ' : ' + (audits[m[0]].displayValue || '—')).join(' · ') + '\n';
            const refs = (cat && cat.auditRefs) || [];
            const failed = refs.map(ref => audits[ref.id])
              .filter(a => a && a.score !== null && a.score < 1
                && !metricIds.some(m => m[0] === a.id))
              .sort((x, y) => savings(y) - savings(x));
            if (!failed.length) { out += "_Aucun audit d'opportunité en échec._\n"; continue; }
            for (const a of failed) {
              const s = savings(a);
              out += '- **' + a.id + '** — ' + a.title
                + (a.displayValue ? ' (' + a.displayValue + ')' : '')
                + (s ? ' — ~' + Math.round(s) + ' ms' : '') + '\n';
            }
          }
          console.log(out);
          EOF

      - name: Contrôle des liens cassés (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # On crawle la page d'accueil et la page légale déployées. Le préfixe
          # « Données du COR » est exclu : ces fichiers-preuve ne sont
          # volontairement pas servis (404 attendu), seuls de VRAIS liens morts
          # doivent faire échouer l'étape.
          args: >-
            --no-progress
            --exclude 'Donn%C3%A9es%20du%20COR'
            --exclude 'Données du COR'
            https://wald52.github.io/Le-COR/
            https://wald52.github.io/Le-COR/legal.html
          fail: true
